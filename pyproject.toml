[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "normacopilot"
version = "1.0.0"
description = "Consulta verificable de normativa laboral española con fuentes del BOE"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "pydantic-settings>=2.8,<3", "psycopg[binary,pool]>=3.2,<4", "pgvector>=0.4,<1", "langgraph>=1,<2", "langfuse>=5,<6", "numpy>=2,<3", "rapidfuzz>=3,<4", "apscheduler>=3.11,<4", "defusedxml>=0.7,<1"]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.25"]
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
